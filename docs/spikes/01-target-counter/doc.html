<script>
  // Signal déterministe de fin de pagination, documenté par Paged.js.
  window.PagedConfig = { after: () => { window.__pagedDone = true } }
</script>
<style>
@page {
  size: A4;
  margin: 20mm;
  @bottom-right { content: "Page " counter(page) " / " counter(pages); font: 10pt sans-serif; }
  @top-left { content: "Spike — en-tête répété"; font: 9pt sans-serif; color: #888; }
}
body { font-family: sans-serif; }
h2 { break-before: page; }
.toc a::after {
  /* LE point à vérifier : Paged.js résout-il target-counter ? */

  color: crimson; font-weight: bold;
}
.toc { list-style: none; padding: 0; }
.toc li { margin: 6px 0; }
.filler { height: 120mm; background: #f4f4f4; }
</style>
